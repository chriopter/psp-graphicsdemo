name: PSP build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: pspdev/pspdev:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build EBOOT.PBP
        run: make
      - name: Package
        run: apk add --no-cache zip && sh tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: psp-graphicsdemo-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: psp-graphicsdemo-${{ github.sha }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
      - uses: chriopter/pspdx/action@master
        with:
          tag: ${{ github.ref_name }}
